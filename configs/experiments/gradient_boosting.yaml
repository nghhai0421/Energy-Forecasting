run_name: gradient_boosting_final_grid_load_15min
model: gradient_boosting
data:
  pipeline: split_15min # Retained contract identifier for saved HPO/checkpoint compatibility.
  sources:
    consumption:
      development: Dataset/raw/csv/Actual_consumption_2023_2024_Quarterhour.csv
      demo: Dataset/raw/csv/Actual_consumption_2025_Quarterhour.csv
      timestamp_column: Start date
      timezone: Europe/Berlin
      columns: ['grid load [MWh]']
    weather:
      development: Dataset/raw/csv/open-meteo-48.83N9.15E293m_2023_2024.csv
      demo: Dataset/raw/csv/open-meteo-48.83N9.15E293m_2025.csv
      timestamp_column: time
      timezone: '+02:00'
      columns: ['temperature_2m (°C)', 'wind_speed_10m (km/h)', 'dew_point_2m (°C)']
    prices:
      development: Dataset/raw/csv/Day-ahead_prices_2023_2024_Quarterhour.csv
      demo: Dataset/raw/csv/Day-ahead_prices_2025_Quarterhour.csv
      timestamp_column: Start date
      timezone: Europe/Berlin
      columns: ['Germany/Luxembourg [€/MWh]']
    holidays:
      path: Dataset/raw/csv/df_holiday.csv
      date_column: Datum
      timezone: Europe/Berlin
  timestamp_column: timestamp_utc
  target_column: grid load [MWh]
  frequency: 15min
  lag_hours: [24, 168]
  observation_delay_minutes: 60 # Explicit replay assumption; effective lags 25h/169h.
  lag_fields:
    load: grid load [MWh]
    temperature: temperature_2m (°C)
    wind: wind_speed_10m (km/h)
    dew_point: dew_point_2m (°C)
    price: Germany/Luxembourg [€/MWh]

forecast:
  lookback: 676 # Seven days plus one-hour availability buffer.
  horizon: 96
  step_length: 96

split:
  train_start: '2023-01-01T00:00:00+01:00'
  test_start: '2025-01-01T00:00:00+01:00'
  test_end: '2026-01-01T00:00:00+01:00'
  validation_starts:
    - '2024-04-01T00:00:00+02:00'
    - '2024-07-01T00:00:00+02:00'
    - '2024-10-01T00:00:00+02:00'

output_root: outputs

# Selected on 2023-2024 validation; used by --stage evaluate.
parameters:
  learning_rate: 0.05337193482375701
  max_iter: 100
  max_depth: 8
  max_leaf_nodes: 59
  min_samples_leaf: 64
  l2_regularization: 0.01574118047380971
  random_state: 42

# Development-only search; used by --stage hpo or --stage all.
hpo:
  n_trials: 12
  seed: 42
  search_space:
    learning_rate:
      type: float
      low: 0.03
      high: 0.2
      log: true
    max_depth:
      type: int
      low: 3
      high: 10
    max_leaf_nodes:
      type: int
      low: 8
      high: 63
    min_samples_leaf:
      type: int
      low: 20
      high: 100
    max_iter:
      type: int
      low: 100
      high: 300
      step: 50
    l2_regularization:
      type: float
      low: 0.01
      high: 10.0
      log: true
