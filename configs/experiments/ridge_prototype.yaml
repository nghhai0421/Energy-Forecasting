run_name: ridge_prototype

model: ridge_regression

data:
  path: Dataset/energy_hourly.csv
  timestamp_column: Date from
  target_column: Grid load [MWh] calculated resolutions
  covariates: []

forecast:
  lookback: 24
  horizon: 24
  step_length: 24          # Refit every 24 observations.

split:
  test_fraction: 0.2       # Hold out 20% for testing.
  train_window_fraction: 0.8 # Train on 70% of development per window.

output_root: outputs
