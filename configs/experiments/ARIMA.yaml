run_name: ARIMA_run

model: ARIMA

data:
  path: Dataset/preprocessed_dataset_1y.csv
  timestamp_column: timestamp_utc
  target_column: grid load [MWh]
  frequency: 15min
  covariates: []

forecast:
  horizon: 24             # Six hours of 15-minute observations.
  step_length: 24         # Refit every six hours.

split:
  test_fraction: 0.2       # 20% of the full series.
  train_window_fraction: 0.8 # Use 80% of development as each fixed CV/test training window.

output_root: outputs
