run_name: ARIMA_run

model: ARIMA

data:
  path: Dataset/raw/energy_hourly.csv
  timestamp_column: Date from
  target_column: Grid load [MWh] calculated resolutions
  frequency: h

forecast:
  horizon: 24
  step_length: 24

split:
  test_fraction: 0.2
  train_window_fraction: 0.8

output_root: outputs
