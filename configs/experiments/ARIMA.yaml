run_name: ARIMA_run

model: ARIMA

data:
  path: Dataset/preprocessed/Actual_consumption_2023_2024_Quarterhour.csv
  timestamp_column: Start date
  target_column: Residual load [MWh]
  frequency: 15min

forecast:
  horizon: 96
  step_length: 4

split:
  test_fraction: 0.2
  train_window_fraction: 0.8

output_root: outputs
